chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
encoding_rs = "0.8.44"
getrandom = "0.4.3"

md-5 = "0.11.0"
rc4 = "0.2.0"
roxmltree = "0.21.2"
sha1 = "0.11.0"
sha2 = "0.11.1"








