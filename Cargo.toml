[package]
name = "jackcess"
version = "5.0.4-rs.1"
edition = "2021"
description = "Rust port of the Jackcess MS Access (Jet/ACE) database library"
license = "Apache-2.0"
repository = "https://github.com/pcmaclk/jackcess-rs"
readme = "README.md"
keywords = ["access", "mdb", "accdb", "jet", "database"]
categories = ["database", "parser-implementations"]
exclude = ["target/*", "out/*", "external/*", "java-classes/*", ".rollback-backup-*", ".clippy_*"]
# Only the tools that ship are listed below; the verification generators are
# gated behind the `dev-bins` feature so `cargo build --release` stays small.
autobins = false

[lib]
name = "jackcess"
path = "src/lib.rs"

[[bin]]
name = "mdbgen"
path = "src/bin/mdbgen.rs"

[[bin]]
name = "mdbdump"
path = "src/bin/mdbdump.rs"

[[bin]]
name = "jetcrypt"
path = "src/bin/jetcrypt.rs"
required-features = ["crypto"]

[[bin]]
name = "zonedategen"
path = "src/bin/zonedategen.rs"

[features]
default = ["create", "crypto"]
# Embedded empty-database templates and Database::create.
create = []
# Page encoding / encryption support (aes, rc4, sha1, sha2, md-5, base64,
# getrandom, roxmltree) and jackcess-encrypt-compatible handlers.
crypto = []

# Tests that need the (uncommitted) Java/vs-Rust fixture corpora under
# resources/*_ref, tools/ and external/.  They are skipped by default.
fixtures = []
# The Java-vs-Rust verification generators in src/bin.  They are development
# tools, not part of the released crate; enable them with
# `cargo build --features dev-bins` when running tools/verify-*.ps1.
dev-bins = ["crypto"]

# --- verification generators (development only) -------------------------

[[bin]]
name = "apisurface"
path = "src/bin/apisurface.rs"
required-features = ["dev-bins"]

[[bin]]
name = "attachgen"
path = "src/bin/attachgen.rs"
required-features = ["dev-bins"]

[[bin]]
name = "codepage"
