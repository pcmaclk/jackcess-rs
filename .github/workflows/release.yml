name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v5.0.4-rs.2)"
        required: true
        default: "v5.0.4-rs.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release tools
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            for b in mdbgen mdbdump jetcrypt zonedategen; do
              cp "target/release/${b}.exe" dist/
            done
            powershell -NoProfile -Command \
              "Compress-Archive -Path dist/*.exe -DestinationPath 'dist/jackcess-rs-${TAG}-${{ matrix.name }}.zip'"
          else
            for b in mdbgen mdbdump jetcrypt zonedategen; do
              cp "target/release/${b}" dist/
            done
            (cd dist && zip -j "jackcess-rs-${TAG}-${{ matrix.name }}.zip" \
              mdbgen mdbdump jetcrypt zonedategen)
          fi
          ls -l dist

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --prerelease
          gh release upload "$TAG" dist/*.zip --clobber

